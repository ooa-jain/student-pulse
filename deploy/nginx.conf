server {
    listen 80;
    server_name aipulse.juooa.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aipulse.juooa.cloud;

    # certbot --nginx -d aipulse.juooa.cloud
    ssl_certificate     /etc/letsencrypt/live/aipulse.juooa.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipulse.juooa.cloud/privkey.pem;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built assets are content-hashed — cache them hard.
    location /assets/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
