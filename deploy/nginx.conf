# Hostinger VPS 31.97.186.191 — DNS A record: jain-studentpulse -> 31.97.186.191
# Replace __DOMAIN__ with the full hostname before installing, or let
# deploy/hostinger-deploy.sh substitute it for you.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let certbot answer the HTTP-01 challenge before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # certbot --nginx -d __DOMAIN__
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built assets are content-hashed — cache them hard.
    location /assets/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
